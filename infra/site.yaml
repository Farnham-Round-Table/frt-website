AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Farnham Round Table website: private S3 bucket served through CloudFront over
  HTTPS, plus an IAM role that GitHub Actions uses to deploy the site.
  Deploy this stack in us-east-1, because CloudFront only accepts certificates from there.

Parameters:
  DomainName:
    Type: String
    Default: farnhamroundtable.org.uk
    Description: Apex domain of the site. www.<DomainName> is also served and redirects to it.
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone ID for DomainName. When set, the certificate is validated and the
      DNS records are created automatically. Leave empty if DNS is managed elsewhere.
  GitHubRepository:
    Type: String
    Default: Farnham-Round-Table/frt-website
    Description: owner/name of the repository allowed to deploy (case sensitive).
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch whose workflow runs may deploy.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to false if this AWS account already has an IAM OIDC provider for
      token.actions.githubusercontent.com.

Rules:
  MustDeployInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: CloudFront certificates must be issued in us-east-1, so deploy this stack there.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Keeps deleted or overwritten files for 30 days, so a bad deploy can be undone.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ListBucket lets missing pages return 404 rather than 403.
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Sub "www.${DomainName}"
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Redirects www to the apex domain, and maps folder URLs such as /about-us/
  # to /about-us/index.html, which is how the pages are stored.
  RequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-request"
      AutoPublish: true
      FunctionConfig:
        Comment: www redirect and index.html rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: location } }
          };
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;

          if (host === 'www.${DomainName}') {
            return redirect('https://${DomainName}' + uri);
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            // Pages use relative links, so /about-us must become /about-us/.
            return redirect(uri + '/');
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${DomainName} website"
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Edge locations in Europe and North America only: the cheapest option.
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed policies: CachingOptimized and SecurityHeadersPolicy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RequestFunction.FunctionMetadata.FunctionARN

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2 # Fixed zone ID used by every CloudFront distribution.
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # Assumed by .github/workflows/deploy.yml; it can only upload to the bucket
  # and clear the CloudFront cache.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Deploys the website from GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: Set as the AWS_S3_BUCKET repository variable.
    Value: !Ref SiteBucket
  DistributionId:
    Description: Set as the AWS_CLOUDFRONT_DISTRIBUTION_ID repository variable.
    Value: !Ref Distribution
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt DeployRole.Arn
  CloudFrontDomainName:
    Description: Point DNS here (ALIAS or CNAME) if DNS is not in Route 53.
    Value: !GetAtt Distribution.DomainName
